<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
  <title>Buzzer · Câmera · SESI</title>
  <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@700;800;900&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing:border-box; margin:0; padding:0; }
    html, body { height:100%; background:#0a0c12; color:#fff; font-family:'Baloo 2',sans-serif; overflow:hidden; user-select:none; -webkit-user-select:none; }

    .tela { display:none; height:100vh; flex-direction:column; align-items:center; justify-content:center; padding:20px; gap:14px; text-align:center; }
    .tela.visivel { display:flex; }

    h1  { font-size:clamp(20px,4vw,28px); font-weight:900; }
    p   { font-size:14px; color:#aaa; max-width:38ch; line-height:1.6; }

    .btn-prim { background:#fff; color:#0a0c12; border:none; border-radius:14px; padding:13px 32px; font-size:17px; font-weight:900; font-family:inherit; cursor:pointer; transition:opacity .15s; }
    .btn-prim:hover { opacity:.88; }
    .btn-prim:disabled { opacity:.3; cursor:not-allowed; }
    .btn-sec { font-size:13px; color:#aaa; background:none; border:1px solid #333; border-radius:8px; padding:7px 14px; cursor:pointer; font-family:inherit; }
    .btn-sec:hover { color:#fff; border-color:#666; }

    /* ── Tela calibração ── */
    #tela-cal { padding:0; justify-content:flex-start; }

    #video-wrap {
      position:relative; flex:1; width:100%; overflow:hidden;
      background:#000; cursor:crosshair; touch-action:none;
    }
    #video { position:absolute; inset:0; width:100%; height:100%; object-fit:cover; pointer-events:none; }
    #overlay-cal { position:absolute; inset:0; width:100%; height:100%; pointer-events:none; }

    #cal-instrucao {
      width:100%; padding:9px 16px; text-align:center;
      font-size:14px; font-weight:800; color:#fff;
      background:rgba(0,0,0,.82); backdrop-filter:blur(6px);
      flex-shrink:0; min-height:42px; display:flex; align-items:center; justify-content:center;
      transition: color .2s;
    }

    #cal-strip {
      width:100%; display:flex; justify-content:center; gap:10px; padding:10px 12px;
      background:rgba(0,0,0,.88); backdrop-filter:blur(8px); flex-shrink:0;
    }
    .strip-btn {
      display:flex; flex-direction:column; align-items:center; gap:3px;
      width:64px; padding:8px 4px; border-radius:14px; border:2px solid #333;
      background:rgba(255,255,255,.04); cursor:pointer; transition:all .15s;
      font-family:inherit; color:#fff; font-size:10px; font-weight:800;
      -webkit-tap-highlight-color:transparent;
    }
    .strip-btn .sb-emoji { font-size:26px; line-height:1; }
    .strip-btn.colocado  { border-color:#4ade80; background:rgba(74,222,128,.12); }
    .strip-btn.selecionado {
      border-width:3px; background:rgba(255,255,255,.15);
      transform:scale(1.08);
      animation:sel-pulse .8s ease-in-out infinite alternate;
    }
    @keyframes sel-pulse {
      from { box-shadow:0 0 0 0 rgba(255,255,255,.0); }
      to   { box-shadow:0 0 0 8px rgba(255,255,255,.0); }
    }

    #cal-footer {
      width:100%; padding:10px 14px;
      background:rgba(0,0,0,.9); backdrop-filter:blur(8px);
      display:flex; justify-content:space-between; align-items:center; gap:8px;
      flex-shrink:0;
    }

    /* ── Tela jogo ── */
    #tela-jogo { padding:0; justify-content:flex-start; }

    #cam-preview { position:relative; width:100%; flex-shrink:0; background:#000; overflow:hidden; max-height:40vh; }
    #video-jogo  { position:absolute; inset:0; width:100%; height:100%; object-fit:cover; }
    #overlay-jogo { position:absolute; inset:0; width:100%; height:100%; pointer-events:none; }
    #cam-preview::before { content:''; display:block; padding-top:56.25%; }

    #jogo-corpo { flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:12px; padding:12px 16px; }
    #status-jogo { font-size:15px; font-weight:700; color:#aaa; }

    #winner-card { display:none; flex-direction:column; align-items:center; gap:10px; padding:22px 28px; border-radius:22px; width:100%; max-width:340px; animation:pop-in .4s ease-out; }
    @keyframes pop-in { from{transform:scale(.8);opacity:0;} to{transform:scale(1);opacity:1;} }
    #winner-emoji { font-size:54px; line-height:1; }
    #winner-nome  { font-size:20px; font-weight:900; }

    #det-bars { display:flex; gap:6px; width:100%; max-width:340px; }
    .det-col { flex:1; display:flex; flex-direction:column; align-items:center; gap:3px; }
    .det-label { font-size:9px; font-weight:800; }
    .det-track { width:100%; height:7px; background:#1a1d27; border-radius:100px; overflow:hidden; }
    .det-fill  { height:100%; border-radius:100px; width:0%; transition:width .06s; }

    #jogo-footer { width:100%; padding:10px 16px; background:rgba(0,0,0,.7); backdrop-filter:blur(8px); display:flex; justify-content:space-between; align-items:center; flex-shrink:0; }

    /* conexão */
    #bar-con { position:fixed; bottom:0; left:0; right:0; display:flex; align-items:center; justify-content:center; gap:5px; font-size:10px; color:rgba(255,255,255,.2); padding:3px; z-index:100; pointer-events:none; }
    .dot { width:5px; height:5px; border-radius:50%; }
    .dot.on  { background:#4ade80; }
    .dot.off { background:#ef4444; animation:blink .8s infinite; }
    @keyframes blink { 50%{opacity:.3;} }

    #flash { position:fixed; inset:0; pointer-events:none; z-index:90; opacity:0; }
    #flash.ativo { animation:flash-anim .5s ease-out forwards; }
    @keyframes flash-anim { 0%{opacity:.6;} 100%{opacity:0;} }
  </style>
</head>
<body>

<!-- TELA 1: Permissão -->
<div id="tela-perm" class="tela visivel">
  <div style="font-size:56px">🎥</div>
  <h1>Buzzer por Câmera</h1>
  <p>Posicione o celular com visão das 4 botoeiras e marque onde cada uma está na tela.</p>
  <button class="btn-prim" onclick="pedirCamera()">📷 Iniciar câmera</button>
</div>

<!-- TELA 2: Posicionamento por toque -->
<div id="tela-cal" class="tela">

  <div id="video-wrap">
    <video id="video" autoplay playsinline muted disablePictureInPicture x-webkit-airplay="deny"></video>
    <canvas id="overlay-cal"></canvas>
  </div>

  <div id="cal-instrucao">Toque em uma cor abaixo para começar</div>

  <div id="cal-strip"></div>

  <div id="cal-footer">
    <button class="btn-sec" onclick="limparPosicoes()">✕ Limpar tudo</button>
    <button class="btn-prim" id="cal-btn-confirmar" disabled onclick="confirmarZonas()">✓ Confirmar</button>
  </div>
</div>

<!-- TELA 3: Jogo -->
<div id="tela-jogo" class="tela">
  <div id="cam-preview">
    <video id="video-jogo" autoplay playsinline muted></video>
    <canvas id="overlay-jogo"></canvas>
  </div>

  <div id="jogo-corpo">
    <div id="det-bars"></div>
    <div id="status-jogo">🟢 Aguardando…</div>
    <div id="winner-card">
      <div id="winner-emoji">🏆</div>
      <div id="winner-nome">—</div>
    </div>
  </div>

  <div id="jogo-footer">
    <button class="btn-sec" onclick="resetarRodada()">↺ Nova rodada</button>
    <span style="font-size:11px;color:#444" id="det-status">—</span>
    <button class="btn-sec" onclick="voltarCal()">⚙ Reposicionar</button>
  </div>
</div>

<div id="flash"></div>
<canvas id="canal" style="display:none"></canvas>

<div id="bar-con">
  <div class="dot off" id="dot-con"></div>
  <span id="txt-con">Conectando…</span>
</div>

<script>
// ── Times ─────────────────────────────────────────────────────────
const TIMES = [
  { id:'vermelha', nome:'Turma A · Vermelha', cor:'#E5484D', corEscura:'#7A1F22', emoji:'🔴' },
  { id:'azul',     nome:'Turma B · Azul',     cor:'#2F8FE0', corEscura:'#164A72', emoji:'🔵' },
  { id:'verde',    nome:'Turma C · Verde',     cor:'#3C9A5F', corEscura:'#1E4E30', emoji:'🟢' },
  { id:'amarela',  nome:'Turma D · Amarela',   cor:'#E0B23C', corEscura:'#7A5D14', emoji:'🟡' },
];

const RTDB        = 'https://torneio-sesi-20de0-default-rtdb.firebaseio.com/buzzer';
const STORAGE_KEY = 'torneio-buzzer-cam:v3';

// Parâmetros LED
const ANAL_W    = 160;
const ANAL_H    = 120;
const ZONA_R_AN = 14;
const DET_DELTA = 35;
const LOCK_MS   = 700;

// Estado calibração
let videoStream  = null;
let posicoes     = {};         // { teamId: {fx, fy} } — fração 0-1
let selecionado  = null;       // teamId atualmente selecionado para posicionar
let calAnimFrame = null;

// Estado jogo
let zonas       = [];
let detectando  = false;
let baseline    = [];
let lumAtual    = [];
let lockUntil   = 0;
let declarando  = false;
let rodadaAtual = -1;
let sseConn     = null;

// ── Áudio ─────────────────────────────────────────────────────────
const aC = new (window.AudioContext || window.webkitAudioContext)();
function tocarSom(tid) {
  if (aC.state==='suspended') aC.resume();
  const t=aC.currentTime;
  const sons={
    vermelha:()=>{const o=aC.createOscillator(),g=aC.createGain();o.connect(g);g.connect(aC.destination);o.type='sawtooth';o.frequency.setValueAtTime(180,t);o.frequency.exponentialRampToValueAtTime(80,t+.5);g.gain.setValueAtTime(.5,t);g.gain.exponentialRampToValueAtTime(.001,t+.55);o.start(t);o.stop(t+.6);},
    azul:()=>{[880,1320,1760].forEach((f,i)=>{const o=aC.createOscillator(),g=aC.createGain();o.connect(g);g.connect(aC.destination);o.type='sine';o.frequency.value=f;const t0=t+i*.04;g.gain.setValueAtTime(0,t0);g.gain.linearRampToValueAtTime(.3-i*.08,t0+.02);g.gain.exponentialRampToValueAtTime(.001,t0+.6);o.start(t0);o.stop(t0+.65);});},
    verde:()=>{const o=aC.createOscillator(),g=aC.createGain();o.connect(g);g.connect(aC.destination);o.type='triangle';o.frequency.setValueAtTime(300,t);o.frequency.exponentialRampToValueAtTime(700,t+.25);g.gain.setValueAtTime(.4,t);g.gain.exponentialRampToValueAtTime(.001,t+.4);o.start(t);o.stop(t+.45);},
    amarela:()=>{[0,.18].forEach(d=>{const o=aC.createOscillator(),g=aC.createGain();o.connect(g);g.connect(aC.destination);o.type='square';o.frequency.value=660;const t0=t+d;g.gain.setValueAtTime(.3,t0);g.gain.exponentialRampToValueAtTime(.001,t0+.14);o.start(t0);o.stop(t0+.15);});},
  };
  (sons[tid]||sons.vermelha)();
}

// ── Câmera ────────────────────────────────────────────────────────
async function pedirCamera() {
  try {
    videoStream = await navigator.mediaDevices.getUserMedia({
      video: { facingMode: { ideal: 'environment' }, width: { ideal: 1280 }, height: { ideal: 720 } },
      audio: false
    });
    document.getElementById('video').srcObject      = videoStream;
    document.getElementById('video-jogo').srcObject = videoStream;
    iniciarCal();
    conectarSSE();
  } catch(e) {
    alert('Câmera não disponível.\n' + e.message);
  }
}

// ── Tela de calibração ────────────────────────────────────────────
function iniciarCal() {
  // Carrega posições salvas
  try {
    const salvo = JSON.parse(localStorage.getItem(STORAGE_KEY) || 'null');
    if (salvo && typeof salvo === 'object') posicoes = salvo;
  } catch(_) {}

  construirStrip();
  mostrarTela('tela-cal');

  // Seleciona automaticamente a primeira não posicionada
  const primeira = TIMES.find(t => !posicoes[t.id]);
  selecionado = primeira ? primeira.id : null;

  // Eventos de toque/clique no vídeo
  const wrap = document.getElementById('video-wrap');
  wrap.addEventListener('click',      aoClicarVideo);
  wrap.addEventListener('touchend',   aoClicarVideo, { passive: false });

  iniciarLoopCal();
  atualizarCalUI();
}

function construirStrip() {
  const strip = document.getElementById('cal-strip');
  strip.innerHTML = '';
  TIMES.forEach(tm => {
    const btn = document.createElement('button');
    btn.className = 'strip-btn';
    btn.id = 'sb-' + tm.id;
    btn.innerHTML = `<div class="sb-emoji">${tm.emoji}</div><div>${tm.nome.split('·')[1].trim()}</div>`;
    btn.addEventListener('click', () => selecionarTime(tm.id));
    strip.appendChild(btn);
  });
}

function selecionarTime(id) {
  selecionado = (selecionado === id) ? null : id;
  atualizarCalUI();
}

function aoClicarVideo(e) {
  e.preventDefault();
  const wrap = document.getElementById('video-wrap');
  const rect  = wrap.getBoundingClientRect();

  let cx, cy;
  if (e.changedTouches && e.changedTouches.length > 0) {
    cx = e.changedTouches[0].clientX;
    cy = e.changedTouches[0].clientY;
  } else {
    cx = e.clientX;
    cy = e.clientY;
  }

  const fx = clamp((cx - rect.left)  / rect.width,  0.04, 0.96);
  const fy = clamp((cy - rect.top)   / rect.height, 0.04, 0.96);

  // Verifica se tocou perto de um círculo já colocado (raio ~9% da largura)
  const RAIO = 0.09;
  for (const tm of TIMES) {
    const p = posicoes[tm.id];
    if (p && Math.hypot(fx - p.fx, fy - p.fy) < RAIO) {
      selecionado = tm.id;
      atualizarCalUI();
      return;
    }
  }

  if (!selecionado) return;

  // Coloca o círculo selecionado na posição tocada
  posicoes[selecionado] = { fx, fy };

  // Avança para o próximo não posicionado
  const prox = TIMES.find(t => !posicoes[t.id]);
  selecionado = prox ? prox.id : null;

  atualizarCalUI();
}

function atualizarCalUI() {
  const todas = TIMES.every(t => posicoes[t.id]);
  document.getElementById('cal-btn-confirmar').disabled = !todas;

  // Instrução
  const instrEl = document.getElementById('cal-instrucao');
  if (todas && !selecionado) {
    instrEl.textContent = '✅ Todas marcadas — confirme para iniciar';
    instrEl.style.color = '#4ade80';
  } else if (selecionado) {
    const tm = TIMES.find(t => t.id === selecionado);
    instrEl.textContent = `${tm.emoji} Toque no vídeo onde está a botoeira ${tm.nome.split('·')[1].trim()}`;
    instrEl.style.color = tm.cor;
  } else {
    instrEl.textContent = 'Toque em uma cor abaixo para reposicionar';
    instrEl.style.color = '#fff';
  }

  // Atualiza strip
  TIMES.forEach(tm => {
    const btn = document.getElementById('sb-' + tm.id);
    if (!btn) return;
    btn.className = 'strip-btn' +
      (posicoes[tm.id]  ? ' colocado'   : '') +
      (selecionado === tm.id ? ' selecionado' : '');
    btn.style.borderColor = selecionado === tm.id ? tm.cor : (posicoes[tm.id] ? '#4ade80' : '#333');
    btn.innerHTML = `<div class="sb-emoji">${tm.emoji}</div><div>${posicoes[tm.id] ? '✓' : tm.nome.split('·')[1].trim()}</div>`;
  });
}

function limparPosicoes() {
  posicoes = {};
  selecionado = TIMES[0].id;
  atualizarCalUI();
}

// ── Loop de desenho da calibração ─────────────────────────────────
function iniciarLoopCal() {
  if (calAnimFrame) cancelAnimationFrame(calAnimFrame);
  let fc = 0;
  function loop() {
    calAnimFrame = requestAnimationFrame(loop);
    if (++fc % 2 !== 0) return; // ~30fps
    desenharOverlayCal();
  }
  loop();
}

function desenharOverlayCal() {
  const wrap = document.getElementById('video-wrap');
  const cvs  = document.getElementById('overlay-cal');
  const W = wrap.offsetWidth  || 360;
  const H = wrap.offsetHeight || 480;
  if (cvs.width !== W) cvs.width = W;
  if (cvs.height !== H) cvs.height = H;

  const ctx = cvs.getContext('2d');
  ctx.clearRect(0, 0, W, H);

  // Desenha círculos das posições já colocadas
  TIMES.forEach(tm => {
    const p = posicoes[tm.id];
    if (!p) return;
    const px = p.fx * W;
    const py = p.fy * H;
    const r  = 28;
    const sel = selecionado === tm.id;

    // Anel externo (se selecionado: pisca)
    if (sel) {
      const alpha = 0.4 + 0.4 * Math.sin(Date.now() / 200);
      ctx.beginPath(); ctx.arc(px, py, r + 10, 0, Math.PI * 2);
      ctx.strokeStyle = tm.cor + Math.round(alpha * 255).toString(16).padStart(2,'0');
      ctx.lineWidth = 3; ctx.stroke();
    }

    // Círculo preenchido
    ctx.beginPath(); ctx.arc(px, py, r, 0, Math.PI * 2);
    ctx.fillStyle = tm.cor + 'cc';
    ctx.fill();
    ctx.strokeStyle = sel ? '#fff' : tm.cor;
    ctx.lineWidth = sel ? 3 : 2;
    ctx.stroke();

    // Emoji + rótulo
    ctx.font = 'bold 18px sans-serif';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillStyle = '#fff';
    ctx.fillText(tm.emoji, px, py - 5);
    ctx.font = 'bold 9px Baloo 2, sans-serif';
    ctx.fillText(tm.nome.split('·')[1].trim(), px, py + 13);
  });

  // Cursor crosshair se há um selecionado ainda não posicionado
  if (selecionado && !posicoes[selecionado]) {
    const tm = TIMES.find(t => t.id === selecionado);
    // Grade de guia suave
    ctx.strokeStyle = tm.cor + '33';
    ctx.lineWidth = 1;
    ctx.setLineDash([4, 6]);
    // horizontal e vertical no centro
    ctx.beginPath(); ctx.moveTo(0, H/2); ctx.lineTo(W, H/2); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(W/2, 0); ctx.lineTo(W/2, H); ctx.stroke();
    ctx.setLineDash([]);
  }
}

// ── Confirmar e iniciar jogo ───────────────────────────────────────
function confirmarZonas() {
  if (!TIMES.every(t => posicoes[t.id])) return;
  try { localStorage.setItem(STORAGE_KEY, JSON.stringify(posicoes)); } catch(_) {}
  if (calAnimFrame) { cancelAnimationFrame(calAnimFrame); calAnimFrame = null; }

  // Converte para array de zonas
  zonas = TIMES.map(tm => ({ fx: posicoes[tm.id].fx, fy: posicoes[tm.id].fy, timeId: tm.id }));

  mostrarTela('tela-jogo');
  iniciarDeteccao();
}

function voltarCal() {
  detectando = false;
  mostrarTela('tela-cal');
  selecionado = null;
  atualizarCalUI();
  iniciarLoopCal();
}

// ── Detecção de LED por luminância ────────────────────────────────
function iniciarDeteccao() {
  if (aC.state === 'suspended') aC.resume();
  const canal = document.getElementById('canal');
  canal.width  = ANAL_W;
  canal.height = ANAL_H;

  baseline  = Array(4).fill(-1);
  lumAtual  = Array(4).fill(0);
  detectando = true;
  renderDetBars();
  renderOverlayJogo();
  loopDeteccao();
}

function lerLuminanciaZona(ctx, zona) {
  const px = Math.round(zona.fx * ANAL_W);
  const py = Math.round(zona.fy * ANAL_H);
  const x0 = Math.max(0, px - ZONA_R_AN);
  const y0 = Math.max(0, py - ZONA_R_AN);
  const w  = Math.min(ANAL_W, px + ZONA_R_AN) - x0;
  const h  = Math.min(ANAL_H, py + ZONA_R_AN) - y0;
  if (w <= 0 || h <= 0) return 0;
  const d = ctx.getImageData(x0, y0, w, h).data;
  let sum = 0;
  for (let i = 0; i < d.length; i += 4)
    sum += d[i] * 0.299 + d[i+1] * 0.587 + d[i+2] * 0.114;
  return sum / (d.length / 4);
}

let fc2 = 0;
function loopDeteccao() {
  if (!detectando) return;
  requestAnimationFrame(loopDeteccao);
  if (++fc2 % 2 !== 0) return;

  const videoEl = document.getElementById('video-jogo');
  if (videoEl.readyState < 2) return;

  const canal = document.getElementById('canal');
  const ctx   = canal.getContext('2d');
  ctx.drawImage(videoEl, 0, 0, ANAL_W, ANAL_H);

  const agora    = Date.now();
  const bloqueado = agora < lockUntil;

  zonas.forEach((z, i) => {
    const lum = lerLuminanciaZona(ctx, z);
    lumAtual[i] = lum;
    if (baseline[i] < 0) baseline[i] = lum;
    else if (!bloqueado) baseline[i] = baseline[i] * 0.96 + lum * 0.04;
  });

  atualizarDetBars();
  renderOverlayJogoLive();

  if (!bloqueado && !declarando) {
    for (let i = 0; i < zonas.length; i++) {
      if ((lumAtual[i] - baseline[i]) >= DET_DELTA) {
        declararVencedor(zonas[i].timeId);
        lockUntil = agora + LOCK_MS;
        break;
      }
    }
  }
}

async function declararVencedor(teamId) {
  if (declarando) return;
  declarando = true; detectando = false;
  mostrarVencedorUI(teamId);
  try {
    const res  = await fetch(`${RTDB}/winner.json`, { headers: { 'X-Firebase-ETag': 'true' } });
    const etag = res.headers.get('ETag');
    const atual = await res.json();
    if (atual === null) {
      await fetch(`${RTDB}/winner.json`, {
        method: 'PUT',
        headers: { 'Content-Type': 'application/json', 'if-match': etag },
        body: JSON.stringify(teamId)
      });
    }
  } catch(_) {}
  declarando = false;
}

function mostrarVencedorUI(teamId) {
  const tm = TIMES.find(t => t.id === teamId);
  if (!tm) return;
  tocarSom(teamId);
  const fl = document.getElementById('flash');
  fl.style.background = tm.cor;
  fl.classList.remove('ativo'); void fl.offsetWidth; fl.classList.add('ativo');
  document.getElementById('status-jogo').style.display = 'none';
  const card = document.getElementById('winner-card');
  card.style.display = 'flex';
  card.style.background = `linear-gradient(135deg,${tm.corEscura},${tm.cor})`;
  document.getElementById('winner-emoji').textContent = tm.emoji;
  document.getElementById('winner-nome').textContent  = tm.nome;
}

async function resetarRodada() {
  if (aC.state === 'suspended') aC.resume();
  declarando = false; detectando = false;
  const nova = (rodadaAtual || 0) + 1;
  await fetch(`${RTDB}.json`, {
    method: 'PUT', headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ rodada: nova, winner: null, presses: null })
  });
  baseline  = Array(4).fill(-1);
  lockUntil = 0;
  document.getElementById('status-jogo').style.display = '';
  document.getElementById('status-jogo').textContent   = '🟢 Aguardando…';
  document.getElementById('winner-card').style.display = 'none';
  detectando = true;
}

// ── Overlays jogo ─────────────────────────────────────────────────
function renderOverlayJogo() {
  const cvs = document.getElementById('overlay-jogo');
  cvs.width  = cvs.offsetWidth  || 360;
  cvs.height = cvs.offsetHeight || 200;
}

function renderOverlayJogoLive() {
  const cvs = document.getElementById('overlay-jogo');
  if (!cvs.width) return;
  const ctx = cvs.getContext('2d');
  ctx.clearRect(0, 0, cvs.width, cvs.height);
  zonas.forEach((z, i) => {
    const tm    = TIMES.find(t => t.id === z.timeId);
    const px    = z.fx * cvs.width;
    const py    = z.fy * cvs.height;
    const delta = Math.max(0, lumAtual[i] - (baseline[i] || 0));
    const ativo = delta >= DET_DELTA;
    ctx.beginPath(); ctx.arc(px, py, 14, 0, Math.PI * 2);
    ctx.strokeStyle = ativo ? '#fff' : tm.cor;
    ctx.lineWidth   = ativo ? 3 : 2;
    ctx.stroke();
    ctx.fillStyle = ativo ? tm.cor : tm.cor + '33';
    ctx.fill();
    ctx.font = '12px sans-serif';
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillStyle = '#fff';
    ctx.fillText(tm.emoji, px, py);
  });
}

function renderDetBars() {
  const c = document.getElementById('det-bars');
  c.innerHTML = '';
  TIMES.forEach(tm => {
    c.innerHTML += `
      <div class="det-col">
        <div class="det-label" style="color:${tm.cor}">${tm.emoji}</div>
        <div class="det-track"><div class="det-fill" id="df-${tm.id}" style="background:${tm.cor}"></div></div>
      </div>`;
  });
}

function atualizarDetBars() {
  zonas.forEach((z, i) => {
    const el  = document.getElementById('df-' + z.timeId);
    if (!el) return;
    const pct = Math.min(100, Math.max(0, (lumAtual[i] - (baseline[i]||0)) / (DET_DELTA * 1.5) * 100));
    el.style.width = pct + '%';
  });
}

// ── SSE Firebase ──────────────────────────────────────────────────
function conectarSSE() {
  sseConn = new EventSource(`${RTDB}.json`);
  sseConn.addEventListener('put',   e => tratarSSE(JSON.parse(e.data)));
  sseConn.addEventListener('patch', e => tratarSSE(JSON.parse(e.data)));
  sseConn.onopen  = () => { document.getElementById('dot-con').className='dot on';  document.getElementById('txt-con').textContent='Conectado ao telão'; };
  sseConn.onerror = () => { document.getElementById('dot-con').className='dot off'; document.getElementById('txt-con').textContent='Reconectando…'; sseConn.close(); setTimeout(conectarSSE, 4000); };
}

function tratarSSE({ path, data }) {
  const rodada = path==='/' ? data?.rodada : (path==='/rodada' ? data : undefined);
  if (rodada !== undefined && rodada !== rodadaAtual) {
    rodadaAtual = rodada;
    if (!detectando) {
      declarando = false; baseline = Array(4).fill(-1); lockUntil = 0;
      document.getElementById('status-jogo').style.display = '';
      document.getElementById('status-jogo').textContent   = '🟢 Aguardando…';
      document.getElementById('winner-card').style.display = 'none';
      detectando = true;
    }
  }
}

// ── Navegação ─────────────────────────────────────────────────────
function mostrarTela(id) {
  document.querySelectorAll('.tela').forEach(t => t.classList.remove('visivel'));
  document.getElementById(id).classList.add('visivel');
  if (id === 'tela-jogo') setTimeout(() => { renderOverlayJogo(); renderDetBars(); }, 120);
}

function clamp(v, min, max) { return Math.max(min, Math.min(max, v)); }

document.addEventListener('keydown', e => {
  if (e.code === 'Space') { e.preventDefault(); resetarRodada(); }
});
</script>
